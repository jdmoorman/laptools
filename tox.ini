[tox]
envlist = py36, py37, py38, lint, docs, manifest


# Keep docs in sync with docs env, .readthedocs.yml.
[gh-actions]
python =
    3.6: py36
    3.7: lint, docs, py37
    3.8: manifest, py38


[pytest]
markers =
    raises


[coverage:run]
parallel = true
branch = true


[coverage:paths]
source =
    src/
    .tox/*/site-packages/


[testenv]
extras =
    test
commands =
    pytest --basetemp={envtmpdir} \
           --cov-report=term-missing \
           --cov=laptools \
           --verbose \
           tests/


[testenv:lint]
basepython = python3.7
deps = pre-commit
skip_install = true
commands =
    pre-commit run --all-files


[testenv:docs]
# Keep basepython in sync with gh-actions and .readthedocs.yml.
basepython = python3.7
extras = docs
commands =
    python -m doctest README.md


[testenv:manifest]
basepython = python3.8
deps = check-manifest
skip_install = true
commands =
    check-manifest


[testenv:perf]
changedir = {toxinidir}/benchmarks
basepython = python3.7
extras = perf
commands =
    # https://pyperf.readthedocs.io/en/latest/runner.html#runner-cli
    # tox -e perf -- 10 # Run 10 trials for each method on each of four different matrices
    python bench.py -o {envtmpdir}/bench.json --values={posargs:1} --processes={posargs:1}
    python plot.py {envtmpdir}/bench.json bench.pdf

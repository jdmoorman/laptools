[bumpversion]
current_version = 0.1.6
commit = True
tag = True

[bumpversion:file:setup.py]
search = {current_version}
replace = {new_version}

[bumpversion:file:src/clapsolver/__init__.py]
search = {current_version}
replace = {new_version}

[bdist_wheel]
universal = 1

[aliases]
test = pytest

[flake8]
max-line-length = 1000
max-complexity = 18
select = C,E,F,W,B,B950
ignore = E203, E266, E501, W503, F403, F401
